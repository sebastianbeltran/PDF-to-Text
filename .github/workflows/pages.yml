# Despliega automáticamente a GitHub Pages cada vez que hay un push a main
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite lanzarlo manualmente desde GitHub

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un despliegue a la vez
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # raíz del repositorio (index.html está aquí)

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
